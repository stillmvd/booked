  <use href="#ribbon" fill="url(#sheen)"/>
  <use href="#ribbonInner" fill="none" stroke="#fff" stroke-opacity="0.42" stroke-width="3" stroke-linejoin="round"/>
  <use href="#ribbon" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2" stroke-linejoin="round"/>
