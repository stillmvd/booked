<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="matte" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.6  0 0 0 0 0.62  0 0 0 0.10 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="overlay"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/></feMerge>
    </filter>
    <filter id="slot" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="tileLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a30"/><stop offset="0.55" stop-color="#1c1c21"/><stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="volume" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.06"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="slotShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <path id="ribbon" d="M91 50h74v150l-37-28-37 28z"/>
    <path id="ribbonInner" d="M99 58h58v121l-29-21.5-29 21.5z"/>
    <clipPath id="tile"><rect x="20" y="20" width="216" height="216" rx="58"/></clipPath>
  </defs>
  <rect x="20" y="20" width="216" height="216" rx="58" fill="url(#tileLight)"/>
  <rect x="20" y="20" width="216" height="216" rx="58" fill="#1a1a1f" filter="url(#matte)" opacity="0.9"/>
  <rect x="21" y="21" width="214" height="214" rx="57" fill="none" stroke="#3a3a42" stroke-width="1.2" opacity="0.7"/>
  <g clip-path="url(#tile)"><use href="#ribbon" fill="#ff2a3a" opacity="0.75" filter="url(#glow)"/></g>
  <rect x="82" y="41" width="92" height="20" rx="10" fill="#000" opacity="0.85" filter="url(#slot)"/>
  <use href="#ribbon" fill="#ff3347" opacity="0.93"/>
  <use href="#ribbon" fill="url(#volume)"/>
  <use href="#ribbon" fill="url(#sheen)"/>
  <use href="#ribbonInner" fill="none" stroke="#fff" stroke-opacity="0.42" stroke-width="2.2" stroke-linejoin="round"/>
  <use href="#ribbonInner" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1" stroke-linejoin="round" transform="translate(0 1.5)"/>
  <rect x="91" y="50" width="74" height="30" fill="url(#slotShade)"/>
  <use href="#ribbon" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
